apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maskarad
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ECDSA P-256 вместо RSA 2048 по умолчанию: без keep-alive каждый запрос — новое TLS-рукопожатие
    # с подписью ключом сервера. На узле кластера подпись RSA 2048 стоит 0.41 мс CPU, ECDSA P-256 — 0.03 мс
    # (openssl speed, 2026-09-23); из ~4.8 мс CPU ingress-nginx на новое соединение это ~0.4 мс.
    # Always — новый ключ при каждом перевыпуске.
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "256"
    cert-manager.io/private-key-rotation-policy: Always
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [maskarad.example.com]
      secretName: maskarad-tls
  rules:
    - host: maskarad.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: maskarad, port: { name: http } }
