apiVersion: apps/v1
kind: Deployment
metadata:
  name: maskarad
spec:
  # replicas не задаётся: числом реплик управляет HPA.
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: maskarad }
  template:
    metadata:
      labels: { app.kubernetes.io/name: maskarad }
    spec:
      terminationGracePeriodSeconds: 20
      # Сервис не ходит в Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: maskarad
          image: maskarad   # переопределяется в overlay (kustomize images)
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/app/config/maskarad.yaml"]
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - secretRef: { name: maskarad-secrets }
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            # ephemeral-storage — лог контейнера (kubelet ротирует его по размеру); на диск сервис не пишет.
            requests: { cpu: "500m", memory: "256Mi", ephemeral-storage: "64Mi" }
            limits: { cpu: "2", memory: "1Gi", ephemeral-storage: "1Gi" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: maskarad-config }
