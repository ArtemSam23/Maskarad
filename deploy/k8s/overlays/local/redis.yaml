apiVersion: apps/v1
kind: Deployment
metadata:
  name: maskarad-redis
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: maskarad-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: maskarad-redis }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "640Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: maskarad-redis
spec:
  selector: { app.kubernetes.io/name: maskarad-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
