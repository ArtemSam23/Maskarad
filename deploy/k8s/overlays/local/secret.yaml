# Только для локального стенда. В облаке Secret создаёт пайплайн из GitHub Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: maskarad-secrets
type: Opaque
stringData:
  REDIS_URL: "redis://maskarad-redis:6379/0"
  MASKARAD_STORE_KEY: "local-store-key"
  MASKARAD_SECRET: "local-masking-secret"
  MASKARAD_ADMIN_KEY: "local-admin-key"
  MASKARAD_DEMO_MODE: "true"
  SUPPORT_BOT_KEY: "demo-support-key"
  ANALYTICS_KEY: "demo-analytics-key"
  LLM_BASE_URL: ""
  LLM_API_KEY: ""
