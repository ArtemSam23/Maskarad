# Устанавливается скриптом scripts/ingress_nginx_helm.sh <адрес балансировщика> (infra.yml, ops.yml):
# он закрепляет версию чарта (INGRESS_NGINX_CHART_VERSION), копирует образы чарта из registry.k8s.io
# в Container Registry каталога и передаёт реестр через --set controller.image.registry и
# controller.admissionWebhooks.patch.image.registry. registry.k8s.io с узлов тянется через раз:
# контроллер на новом узле застревал в ImagePullBackOff, cr.yandex доступен всегда.
controller:
  # DaemonSet: контроллер есть на каждом узле, поэтому каждый target сетевого балансировщика
  # здоров при externalTrafficPolicy: Local (Deployment с двумя репликами мог оказаться на одном узле,
  # и часть соединений через балансировщик обрывалась).
  kind: DaemonSet
  service:
    type: LoadBalancer
    # Cluster: любой узел принимает трафик балансировщика и передаёт его готовому контроллеру.
    # С Local соединения на узел без готового пода обрывались, пока балансировщик не пометил его нездоровым.
    # Цена: адрес клиента в логах ingress заменяется адресом узла.
    externalTrafficPolicy: Cluster
  config:
    proxy-body-size: "8m"
    use-forwarded-headers: "true"
    # По умолчанию nginx закрывает клиентское соединение после 1 000 запросов, upstream-соединение
    # после 10 000, а пул к upstream — 320 соединений: на 1 000 запросов/с это переоткрытие
    # соединений по нескольку раз в секунду и лишние TCP/TLS-рукопожатия в p99.
    keep-alive-requests: "100000"
    upstream-keepalive-connections: "1000"
    upstream-keepalive-requests: "100000"
    # Тело до 2 МБ буферизуется в памяти, а не во временном файле на диске узла.
    client-body-buffer-size: "2m"
    # Строка на каждый запрос при 1000 rps — основной объём логов кластера; аналитика по запросам
    # есть в метриках nginx (job ingress-nginx у prometheus-agent, addons/monitoring-agent).
    disable-access-log: "true"
  metrics:
    enabled: true
    # ServiceMonitor требует CRD из kube-prometheus-stack, которого больше нет; порт 10254
    # читает prometheus-agent напрямую (addons/monitoring-agent).
    serviceMonitor:
      enabled: false
  # Контроллер на каждом узле рядом с репликой сервиса (request 750m): 300m резервируют ему долю
  # 2 vCPU узла, лимит 2 позволяет забрать всё свободное на пике.
  resources:
    requests: { cpu: "300m", memory: "256Mi" }
    limits: { cpu: "2", memory: "512Mi" }
  # Контроллер должен стоять на каждом узле: если поды сервиса заняли CPU узла раньше DaemonSet-пода
  # (2026-09-23: узел с двумя репликами, контроллер в Pending), критический приоритет даёт ему
  # вытеснить реплику, а та по anti-affinity переезжает на свободный узел.
  priorityClassName: system-cluster-critical
  # По умолчанию 1 с: на занятом узле ответ на пробу может задержаться дольше, а неудачная проба
  # выводит контроллер из endpoints (readiness) или перезапускает его (liveness).
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5
  admissionWebhooks:
    enabled: true
