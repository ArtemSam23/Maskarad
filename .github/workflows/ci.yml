name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, test, quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release
      - name: Configuration is valid
        run: ./target/release/maskarad check-config --config config/maskarad.yaml
      - name: Quality gate (golden dataset, F1 ≥ 0.95)
        shell: bash
        run: |
          ./target/release/maskarad eval --config config/maskarad.yaml --dataset tests/golden \
            --min-f1 0.95 --report quality-report.md | tail -12
          { echo "## Качество на golden-датасете"; cat quality-report.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Contract smoke test against the built binary
        run: |
          MASKARAD_LISTEN=127.0.0.1:18080 MASKARAD_LOG_LEVEL=warn ./target/release/maskarad serve --config config/maskarad.yaml &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break; sleep 1; done
          scripts/smoke.sh http://127.0.0.1:18080
      - name: Source archive for submission
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: maskarad-src
          path: dist/maskarad-src.zip
          retention-days: 14

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  manifests:
    name: kubernetes manifests and terraform formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Render every overlay
        run: |
          for o in local production; do
            kubectl kustomize deploy/k8s/overlays/$o > /dev/null && echo "overlay $o ok"
          done
      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff

  image:
    name: container image builds
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: maskarad:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
